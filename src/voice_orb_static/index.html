<!doctype html>
<!--
  Ava 语音球页面
  ---------------------------------------------------------------------------
  由 Python VoiceOrbServer 以静态文件方式提供（默认 http://127.0.0.1:8765/）。
  职责：
    1. 用 Canvas 2D 画一颗蓝橙金玻璃球体，内部流体随麦克风音量流动、缩放。
    2. 通过 SSE（GET /events）接收后端推送的 amplitude / speaking / status。
    3. 通过 POST /control 开关麦克风或请求退出整个客户端。
  不要依赖浏览器缓存：后端对 html 已加 Cache-Control: no-store。
-->
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <!-- viewport-fit=cover：刘海屏 / 圆角屏也铺满安全区 -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <!-- 系统状态栏颜色，与纯黑背景一致 -->
  <meta name="theme-color" content="#000000">
  <title>Ava</title>
  <style>
    /*
      视觉原则：纯黑底、细线控件、无外圈光晕。
      球体本身由 Canvas 绘制，CSS 只负责叠在画布上的文字与按钮。
    */
    :root {
      color-scheme: dark;
      --text: rgba(255, 255, 255, 0.78);
      --muted: rgba(255, 255, 255, 0.34);
      --line: rgba(255, 255, 255, 0.08);
      font-family: "SF Pro Display", "Segoe UI Variable", "PingFang SC", "Microsoft YaHei", ui-sans-serif, system-ui, sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden; /* 球体全屏，禁止滚动条 */
      background: #000;
      color: var(--text);
    }

    body {
      min-height: 100svh;
      user-select: none; /* 桌面控制台，避免误选中文字 */
      -webkit-tap-highlight-color: transparent;
    }

    /* 全屏画布：球体只画在这里，不参与 DOM 布局 */
    #orb-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      background: #000;
    }

    /*
      覆盖层 UI。pointer-events: none 让点击穿透到画布；
      底部 dock 再单独打开 pointer-events，保证按钮可点。
    */
    .chrome {
      position: fixed;
      inset: 0;
      z-index: 2;
      display: grid;
      grid-template-rows: auto 1fr auto;
      padding:
        max(22px, env(safe-area-inset-top))
        max(24px, env(safe-area-inset-right))
        max(24px, env(safe-area-inset-bottom))
        max(24px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.42em;
      color: var(--muted);
    }

    /* 右上角状态：listening / speaking / paused 三套颜色 */
    .status {
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.16em;
      color: var(--muted);
      transition: color 280ms ease;
    }

    .status.listening { color: rgba(176, 196, 220, 0.7); }
    .status.speaking { color: rgba(214, 168, 112, 0.85); }
    .status.paused { color: rgba(255, 255, 255, 0.22); }

    /* 球体下方短标题，副标题目前隐藏，留给以后扩展 */
    .caption {
      place-self: end center;
      text-align: center;
      padding-bottom: 8px;
    }

    .caption h1 {
      margin: 0;
      font-size: 13px;
      font-weight: 450;
      letter-spacing: 0.18em;
      color: rgba(255, 255, 255, 0.55);
    }

    .caption p { display: none; }

    /* 底部控制条：左侧主按钮 + 右侧退出 */
    .dock {
      pointer-events: auto;
      display: grid;
      grid-template-columns: 1fr auto;
      gap: 8px;
      width: min(100%, 320px);
      margin: 0 auto;
    }

    .btn {
      appearance: none;
      border: 0;
      cursor: pointer;
      font: inherit;
      background: transparent;
      color: inherit;
      transition: opacity 180ms ease, border-color 180ms ease, color 180ms ease;
    }

    .btn:active:not(:disabled) { opacity: 0.7; }
    .btn:focus-visible { outline: 1px solid rgba(255,255,255,0.28); outline-offset: 3px; }
    .btn:disabled { opacity: 0.35; cursor: not-allowed; }

    .btn-main {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 42px;
      padding: 0 16px;
      border-radius: 2px;
      border: 1px solid var(--line);
      color: rgba(255, 255, 255, 0.62);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.14em;
    }

    .btn-main:hover:not(:disabled) {
      border-color: rgba(255, 255, 255, 0.18);
      color: rgba(255, 255, 255, 0.88);
    }

    /* 麦克风关闭时主按钮变淡 */
    .btn-main.off { color: var(--muted); }

    .btn-icon {
      display: grid;
      place-items: center;
      width: 42px;
      height: 42px;
      border-radius: 2px;
      border: 1px solid var(--line);
      color: rgba(255, 255, 255, 0.42);
    }

    .btn-icon:hover:not(:disabled) {
      color: rgba(255, 255, 255, 0.78);
      border-color: rgba(255, 255, 255, 0.18);
    }

    .btn svg {
      width: 16px;
      height: 16px;
      stroke: currentColor;
      fill: none;
      stroke-width: 1.6;
      stroke-linecap: round;
      stroke-linejoin: round;
    }

    /* EventSource 不可用或连接失败时的全屏提示 */
    .overlay {
      position: fixed;
      inset: 0;
      z-index: 10;
      display: none;
      place-items: center;
      padding: 24px;
      background: #000;
    }

    .overlay.show { display: grid; }

    .overlay-card {
      max-width: 280px;
      text-align: center;
      color: var(--muted);
      line-height: 1.7;
      font-size: 13px;
    }

    .overlay-card h2 {
      margin: 0 0 8px;
      color: var(--text);
      font-size: 14px;
      font-weight: 500;
      letter-spacing: 0.12em;
    }
  </style>
</head>
<body>
  <!-- 球体渲染层：所有像素都由 JS 每帧重绘 -->
  <canvas id="orb-canvas" aria-label="语音球体"></canvas>

  <div class="chrome">
    <header class="topbar">
      <div class="brand">AVA</div>
      <!-- aria-live：状态变化时读屏会播报 -->
      <div class="status listening" id="status" aria-live="polite">
        <span id="status-text">聆听中</span>
      </div>
    </header>

    <div class="caption">
      <h1 id="headline">我在听</h1>
      <p id="subtitle">对着麦克风说话即可</p>
    </div>

    <footer class="dock">
      <!-- 开关采集：POST { enabled: bool } -->
      <button class="btn btn-main" id="toggle-btn" type="button" aria-pressed="true">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        </svg>
        <span id="toggle-label">暂停聆听</span>
      </button>
      <!-- 退出客户端：POST { action: "shutdown" }，然后尝试关闭当前窗口 -->
      <button class="btn btn-icon" id="exit-btn" type="button" aria-label="退出">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M12 2v10"/>
          <path d="M6.2 5.5a8 8 0 1 0 11.6 0"/>
        </svg>
      </button>
    </footer>
  </div>

  <div class="overlay" id="overlay">
    <div class="overlay-card">
      <h2>连接中断</h2>
      <p>无法连接到语音助手，请重启 Ava。</p>
    </div>
  </div>

  <script>
    (() => {
      'use strict';

      // ---------- DOM 引用 ----------
      const canvas = document.getElementById('orb-canvas');
      // alpha:false：不透明画布，少一层合成，略省性能
      const ctx = canvas.getContext('2d', { alpha: false });
      const statusEl = document.getElementById('status');
      const statusText = document.getElementById('status-text');
      const headline = document.getElementById('headline');
      const subtitle = document.getElementById('subtitle');
      const toggleBtn = document.getElementById('toggle-btn');
      const toggleLabel = document.getElementById('toggle-label');
      const exitBtn = document.getElementById('exit-btn');
      const overlay = document.getElementById('overlay');

      /**
       * 后端 status 字段到界面文案的映射。
       * 键必须与 VoiceOrbServer.update_level / set_voice_enabled 发出的 status 一致。
       */
      const COPY = {
        LISTENING: { badge: '聆听中', title: '我在听' },
        SPEAKING: { badge: '接收中', title: '正在接收' },
        PAUSED: { badge: '已暂停', title: '已暂停' },
        WAITING: { badge: '连接中', title: '连接中' },
        CLOSING: { badge: '退出中', title: '正在关闭' },
        STOPPED: { badge: '已停止', title: '已停止' },
        OFFLINE: { badge: '离线', title: '离线' }
      };

      /**
       * 球内弥散色块。蓝 / 天蓝 / 橙 / 浅橙 / 金 / 琥珀，交错轨道。
       * orbit  轨道半径（相对球体半径）
       * speed  绕行角速度系数（再乘 flowClock）
       * size   色块半径（相对球体半径）
       * phase  初始相位，避免所有色块同步
       * ecc    椭圆扁率，让色块不像正圆那么机械
       */
      const fluids = [
        { r: 92, g: 168, b: 255, orbit: 0.22, speed: 0.18, size: 0.68, phase: 0.4, ecc: 1.18 },
        { r: 140, g: 210, b: 255, orbit: 0.16, speed: 0.13, size: 0.52, phase: 2.1, ecc: 0.86 },
        { r: 255, g: 132, b: 56, orbit: 0.26, speed: 0.21, size: 0.48, phase: 3.6, ecc: 1.08 },
        { r: 255, g: 176, b: 72, orbit: 0.19, speed: 0.16, size: 0.42, phase: 5.2, ecc: 0.92 },
        { r: 255, g: 214, b: 96, orbit: 0.14, speed: 0.11, size: 0.4, phase: 1.2, ecc: 1.22 },
        { r: 255, g: 188, b: 80, orbit: 0.28, speed: 0.09, size: 0.56, phase: 4.4, ecc: 0.78 }
      ];

      /**
       * 运行时状态。
       * targetAmp  SSE 刚到的目标音量 [0,1]
       * displayAmp 弹簧平滑后的显示音量，驱动球体半径
       * ampVel     弹簧速度，避免音量阶跃导致半径抽搐
       * flowAmp    更慢的包络，只改变内部流动快慢，不跳位置
       * flowClock  累加相位时钟。切勿写成 time*amplitude，否则音量一变色块会瞬移
       * motion     系统「减少动态效果」开启时关闭脉动
       */
      const state = {
        enabled: true,
        speaking: false,
        status: 'LISTENING',
        targetAmp: 0,
        displayAmp: 0,
        ampVel: 0,
        flowAmp: 0,
        flowClock: 0,
        time: 0,
        lastFrame: performance.now(),
        motion: !matchMedia('(prefers-reduced-motion: reduce)').matches,
        dpr: 1
      };

      /**
       * 按设备像素比重设画布，避免高分屏发糊。
       * 上限 2：再高收益小、每帧填充成本大。
       * setTransform 后后续绘制都用 CSS 像素坐标。
       */
      function resize() {
        state.dpr = Math.min(devicePixelRatio || 1, 2);
        canvas.width = Math.max(1, Math.floor(innerWidth * state.dpr));
        canvas.height = Math.max(1, Math.floor(innerHeight * state.dpr));
        canvas.style.width = `${innerWidth}px`;
        canvas.style.height = `${innerHeight}px`;
        ctx.setTransform(state.dpr, 0, 0, state.dpr, 0, 0);
      }

      /**
       * 更新状态文案。同一状态直接返回，避免 SSE 24Hz 反复改 DOM 造成卡顿。
       */
      function setStatus(code) {
        const key = String(code || 'LISTENING').toUpperCase();
        if (state.status === key) return;
        const copy = COPY[key] || COPY.LISTENING;
        state.status = key;
        statusText.textContent = copy.badge;
        headline.textContent = copy.title;
        statusEl.className = 'status';
        if (key === 'SPEAKING') statusEl.classList.add('speaking');
        else if (key === 'PAUSED' || key === 'STOPPED' || key === 'OFFLINE') statusEl.classList.add('paused');
        else statusEl.classList.add('listening');
      }

      /** 同步麦克风开关按钮与内部状态。关闭时把目标音量清零，球体慢慢收回。 */
      function setEnabled(enabled) {
        state.enabled = Boolean(enabled);
        toggleBtn.classList.toggle('off', !state.enabled);
        toggleBtn.setAttribute('aria-pressed', String(state.enabled));
        toggleLabel.textContent = state.enabled ? '暂停聆听' : '恢复聆听';
        if (!state.enabled) {
          state.targetAmp = 0;
          setStatus('PAUSED');
        }
      }

      /**
       * 调用后端控制接口。
       * { enabled: true/false } 开关采集
       * { action: "shutdown" }  退出整个 Ava 进程
       */
      async function postControl(payload) {
        const res = await fetch('/control', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        if (!res.ok) throw new Error(String(res.status));
        return res.json();
      }

      toggleBtn.addEventListener('click', async () => {
        toggleBtn.disabled = true;
        try {
          const payload = await postControl({ enabled: !state.enabled });
          // 以后端实际结果为准，handler 失败时可能仍保持原状态
          setEnabled(payload.enabled);
          if (payload.enabled) setStatus('LISTENING');
        } catch {
          setStatus('OFFLINE');
        } finally {
          toggleBtn.disabled = false;
        }
      });

      exitBtn.addEventListener('click', async () => {
        exitBtn.disabled = true;
        setStatus('CLOSING');
        try {
          const req = postControl({ action: 'shutdown' });
          // 多数浏览器只允许关闭由脚本打开的窗口；失败就停在 STOPPED
          setTimeout(() => { window.open('', '_self'); window.close(); }, 50);
          await req;
          state.targetAmp = 0;
          setStatus('STOPPED');
        } catch {
          exitBtn.disabled = false;
          setStatus('OFFLINE');
        }
      });

      /**
       * 处理 SSE 的 state / level 事件。
       * payload 字段：amplitude, tone, speaking, status, enabled
       */
      function applyLevel(payload) {
        if (!payload) return;
        if (typeof payload.enabled === 'boolean') setEnabled(payload.enabled);
        if (!state.enabled) return;
        state.targetAmp = Math.min(1, Math.max(0, Number(payload.amplitude) || 0));
        state.speaking = Boolean(payload.speaking);
        setStatus(payload.status || (state.speaking ? 'SPEAKING' : 'LISTENING'));
        overlay.classList.remove('show');
      }

      /**
       * 订阅 /events。
       * 后端先推一条 event:state（当前快照），之后约 24Hz 推 event:level。
       * 断线时 EventSource 会自动重连；onerror 只改文案，不弹层。
       */
      function connectEvents() {
        if (!window.EventSource) {
          overlay.classList.add('show');
          return;
        }
        const es = new EventSource('/events');
        es.addEventListener('state', e => {
          try { applyLevel(JSON.parse(e.data)); } catch (err) { console.warn(err); }
        });
        es.addEventListener('level', e => {
          try { applyLevel(JSON.parse(e.data)); } catch (err) { console.warn(err); }
        });
        es.onerror = () => { if (state.enabled) setStatus('WAITING'); };
      }

      /** 把色块对象转成 canvas 可用的 rgba 字符串。 */
      function rgb(c, a) {
        return `rgba(${c.r},${c.g},${c.b},${a})`;
      }

      /**
       * 画球体内部：深色玻璃底 + 蓝橙金流体 + 中心暖光。
       * 调用前必须 clip 成圆形，色块才不会画出球外。
       * 混合模式 lighter：亮部叠加，颜色更通透。
       */
      function drawInterior(cx, cy, radius, energy, t) {
        const glassBody = ctx.createRadialGradient(
          cx - radius * 0.22, cy - radius * 0.28, radius * 0.04,
          cx, cy, radius
        );
        glassBody.addColorStop(0, 'rgba(92, 112, 148, 0.95)');
        glassBody.addColorStop(0.38, 'rgba(38, 48, 68, 0.96)');
        glassBody.addColorStop(1, 'rgba(16, 18, 28, 1)');
        ctx.fillStyle = glassBody;
        ctx.fillRect(cx - radius, cy - radius, radius * 2, radius * 2);

        ctx.globalCompositeOperation = 'lighter';
        for (const fluid of fluids) {
          // 用累加时钟算角度，音量只改变 flowClock 增速，不会让位置跳变
          const a = state.flowClock * fluid.speed + fluid.phase;
          const ox = Math.cos(a) * radius * fluid.orbit;
          const oy = Math.sin(a * 0.86 + 0.4) * radius * fluid.orbit * 0.82;
          const x = cx + ox;
          const y = cy + oy;
          const rx = radius * fluid.size * (1 + energy * 0.22);
          const ry = rx * fluid.ecc;
          const rot = a * 0.35 + fluid.phase * 0.2;

          ctx.save();
          ctx.translate(x, y);
          ctx.rotate(rot);
          const g = ctx.createRadialGradient(0, 0, 0, 0, 0, rx);
          g.addColorStop(0, rgb(fluid, 0.72 + energy * 0.18));
          g.addColorStop(0.4, rgb(fluid, 0.32 + energy * 0.1));
          g.addColorStop(1, rgb(fluid, 0));
          ctx.fillStyle = g;
          ctx.beginPath();
          ctx.ellipse(0, 0, rx, ry, 0, 0, Math.PI * 2);
          ctx.fill();
          ctx.restore();
        }

        ctx.globalCompositeOperation = 'source-over';
        const core = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius * 0.7);
        core.addColorStop(0, `rgba(255, 232, 176, ${0.22 + energy * 0.16})`);
        core.addColorStop(0.4, `rgba(120, 176, 255, ${0.14 + energy * 0.08})`);
        core.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = core;
        ctx.beginPath();
        ctx.arc(cx, cy, radius * 0.7, 0, Math.PI * 2);
        ctx.fill();
      }

      /**
       * 玻璃外壳：体积感、菲涅尔边缘、左上高光、右下弱反射、内外描边。
       * 刻意不加外圈 bloom，保持克制质感。
       */
      function drawGlass(cx, cy, radius, energy) {
        const volume = ctx.createRadialGradient(
          cx - radius * 0.18, cy - radius * 0.22, radius * 0.08,
          cx, cy, radius
        );
        volume.addColorStop(0, 'rgba(255, 255, 255, 0.14)');
        volume.addColorStop(0.38, 'rgba(255, 255, 255, 0.04)');
        volume.addColorStop(0.78, 'rgba(0, 0, 0, 0)');
        volume.addColorStop(1, 'rgba(0, 0, 0, 0.18)');
        ctx.fillStyle = volume;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // 边缘更亮：模拟玻璃掠射角反射
        const fresnel = ctx.createRadialGradient(cx, cy, radius * 0.72, cx, cy, radius);
        fresnel.addColorStop(0, 'rgba(255,255,255,0)');
        fresnel.addColorStop(0.72, 'rgba(210, 224, 236, 0)');
        fresnel.addColorStop(1, 'rgba(230, 238, 248, 0.32)');
        ctx.fillStyle = fresnel;
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.fill();

        // 主高光（左上）
        ctx.save();
        ctx.beginPath();
        ctx.ellipse(cx - radius * 0.22, cy - radius * 0.34, radius * 0.34, radius * 0.18, -0.55, 0, Math.PI * 2);
        const specA = ctx.createRadialGradient(
          cx - radius * 0.28, cy - radius * 0.4, 0,
          cx - radius * 0.22, cy - radius * 0.34, radius * 0.36
        );
        specA.addColorStop(0, 'rgba(255, 255, 255, 0.62)');
        specA.addColorStop(0.35, 'rgba(255, 255, 255, 0.18)');
        specA.addColorStop(1, 'rgba(255, 255, 255, 0)');
        ctx.fillStyle = specA;
        ctx.fill();
        ctx.restore();

        // 底部环境反射，很弱，避免球体像贴在平面上
        ctx.beginPath();
        ctx.ellipse(cx + radius * 0.28, cy + radius * 0.42, radius * 0.18, radius * 0.07, 0.4, 0, Math.PI * 2);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.045)';
        ctx.fill();

        ctx.beginPath();
        ctx.arc(cx, cy, radius - 0.5, 0, Math.PI * 2);
        ctx.strokeStyle = `rgba(236, 242, 250, ${0.32 + energy * 0.08})`;
        ctx.lineWidth = 1;
        ctx.stroke();

        ctx.beginPath();
        ctx.arc(cx, cy, radius - 1.6, 0, Math.PI * 2);
        ctx.strokeStyle = 'rgba(0, 0, 0, 0.35)';
        ctx.lineWidth = 1;
        ctx.stroke();
      }

      /** 球体正下方接触阴影，增加落地感，不是发光光晕。 */
      function drawContact(cx, cy, radius) {
        const shadow = ctx.createRadialGradient(cx, cy + radius * 0.92, 0, cx, cy + radius * 0.92, radius * 0.55);
        shadow.addColorStop(0, 'rgba(0, 0, 0, 0.55)');
        shadow.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = shadow;
        ctx.beginPath();
        ctx.ellipse(cx, cy + radius * 0.96, radius * 0.52, radius * 0.08, 0, 0, Math.PI * 2);
        ctx.fill();
      }

      /**
       * 一帧完整绘制。
       * 半径 = 基础 0.21 * 短边 + 音量 5.5% + 正弦脉动。
       * 脉动幅度随 energy 变大，安静时几乎看不出。
       */
      function render() {
        const w = innerWidth;
        const h = innerHeight;
        const cx = w * 0.5;
        const cy = h * 0.46;
        const energy = state.displayAmp;
        const pulse = state.motion ? Math.sin(state.time * 2.4) * (0.004 + energy * 0.018) : 0;
        const radius = Math.min(w, h) * (0.21 + energy * 0.055 + pulse);

        ctx.fillStyle = '#000';
        ctx.fillRect(0, 0, w, h);

        drawContact(cx, cy, radius);

        ctx.save();
        ctx.beginPath();
        ctx.arc(cx, cy, radius, 0, Math.PI * 2);
        ctx.clip();
        drawInterior(cx, cy, radius, energy, state.time);
        ctx.restore();

        drawGlass(cx, cy, radius, energy);
      }

      /**
       * 动画主循环。
       * 1) 弹簧跟踪 targetAmp → displayAmp（omega=11, zeta=0.92，接近临界阻尼）
       * 2) flowAmp 用更慢的指数平滑，只影响内部转速
       * 3) flowClock 按转速累加，保证色块轨迹连续
       * dt 上限 33ms：切后台回来时避免弹簧一步冲过头。
       */
      function frame(now) {
        const dt = Math.min(0.033, Math.max(0.001, (now - state.lastFrame) / 1000));
        state.lastFrame = now;
        state.time += dt;

        const omega = 11;
        const zeta = 0.92;
        const accel = omega * omega * (state.targetAmp - state.displayAmp) - 2 * zeta * omega * state.ampVel;
        state.ampVel += accel * dt;
        state.displayAmp = Math.min(1, Math.max(0, state.displayAmp + state.ampVel * dt));

        const flowTarget = state.motion ? (state.speaking ? Math.max(state.displayAmp, 0.22) : state.displayAmp) : 0;
        state.flowAmp += (flowTarget - state.flowAmp) * (1 - Math.exp(-dt * 2.4));
        state.flowClock += dt * (0.55 + state.flowAmp * 1.35);

        render();
        requestAnimationFrame(frame);
      }

      /**
       * 兼容旧集成名 SiriOrb。
       * 当前页面自己走 SSE，一般不会被外部调用；保留以免旧脚本报错。
       */
      window.SiriOrb = Object.freeze({
        setAmplitude(value) {
          state.targetAmp = Math.min(1, Math.max(0, Number(value) || 0));
        },
        pulse() { state.targetAmp = Math.min(1, state.targetAmp + 0.1); },
        getAmplitude() { return state.displayAmp; }
      });

      window.addEventListener('resize', resize, { passive: true });
      resize();
      setEnabled(true);
      setStatus('LISTENING');
      connectEvents();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
