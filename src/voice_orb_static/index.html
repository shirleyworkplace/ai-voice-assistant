<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Ava Voice Orb</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body {
    width: 100%; height: 100%;
    background: #000;
    color: #00eaff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
    overflow: hidden;
    user-select: none;
  }
  #orb-canvas {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  #ui {
    position: fixed;
    inset: 0;
    pointer-events: none;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    align-items: center;
    padding: 28px 24px 32px;
    z-index: 10;
  }
  #status-line {
    display: flex;
    align-items: center;
    gap: 10px;
    opacity: 0;
    transition: opacity .4s ease;
    text-shadow: 0 0 10px rgba(0,234,255,.45);
    letter-spacing: .08em;
    font-size: 13px;
    font-weight: 500;
    text-transform: uppercase;
  }
  #status-line.active { opacity: 1; }
  #status-dot {
    width: 7px; height: 7px;
    border-radius: 50%;
    background: #00eaff;
    box-shadow: 0 0 10px #00eaff, 0 0 20px #00eaff;
  }
  #status-text { color: #a8f7ff; }

  #controls {
    pointer-events: auto;
    display: flex;
    gap: 16px;
    opacity: 0;
    transition: opacity .35s ease;
  }
  body:hover #controls, body:focus-within #controls { opacity: 1; }
  button {
    background: rgba(0,20,30,.45);
    border: 1px solid rgba(0,234,255,.28);
    color: #b9fbff;
    padding: 10px 22px;
    border-radius: 24px;
    font-size: 13px;
    letter-spacing: .04em;
    cursor: pointer;
    backdrop-filter: blur(6px);
    box-shadow: 0 0 12px rgba(0,234,255,.08), inset 0 0 14px rgba(0,234,255,.04);
    transition: all .2s ease;
  }
  button:hover {
    border-color: rgba(0,234,255,.65);
    box-shadow: 0 0 18px rgba(0,234,255,.2), inset 0 0 18px rgba(0,234,255,.1);
    transform: translateY(-1px);
  }
  button:active { transform: translateY(1px); }
  #exit-btn {
    width: 38px; height: 38px;
    padding: 0;
    border-radius: 50%;
    display: grid;
    place-items: center;
  }
</style>
</head>
<body>
<canvas id="orb-canvas"></canvas>
<div id="ui">
  <div id="status-line">
    <div id="status-dot"></div>
    <span id="status-text">正在连接…</span>
  </div>
  <div id="controls">
    <button id="toggle-btn" title="暂停/继续">暂停</button>
    <button id="exit-btn" title="退出">✕</button>
  </div>
</div>

<script>
(() => {
  const canvas = document.getElementById('orb-canvas');
  const ctx = canvas.getContext('2d');
  const statusLine = document.getElementById('status-line');
  const statusText = document.getElementById('status-text');
  const statusDot = document.getElementById('status-dot');
  const toggleBtn = document.getElementById('toggle-btn');
  const exitBtn = document.getElementById('exit-btn');

  let width, height, cx, cy, DPR;
  let orbRadius = 160;

  const state = {
    status: 'connecting',
    enabled: true,
    amplitude: 0,
    tone: 0,
    speaking: false,
    paused: false
  };

  const STATUS_TEXT = {
    connecting: '正在连接…',
    listening: '聆听中',
    receiving: '接收中',
    processing: '处理中',
    speaking: '说话中',
    idle: '等待中',
    paused: '已暂停',
    offline: '离线'
  };

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    width = window.innerWidth;
    height = window.innerHeight;
    canvas.width = Math.floor(width * DPR);
    canvas.height = Math.floor(height * DPR);
    canvas.style.width = width + 'px';
    canvas.style.height = height + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    cx = width / 2;
    cy = height / 2;
    orbRadius = Math.min(width, height) * 0.22;
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- 3D helpers ----------
  function rotateY(x, y, z, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x: x*c - z*s, y, z: x*s + z*c };
  }
  function rotateX(x, y, z, a) {
    const c = Math.cos(a), s = Math.sin(a);
    return { x, y: y*c - z*s, z: y*s + z*c };
  }
  function project(p) {
    const fov = 600;
    const scale = fov / (fov - p.z);
    return { x: cx + p.x * scale, y: cy + p.y * scale, scale, z: p.z };
  }

  // ---------- Sphere mesh ----------
  const latCount = 64;
  const lonCount = 88;
  const points = [];
  for (let lat = 0; lat <= latCount; lat++) {
    const theta = (lat / latCount) * Math.PI;
    for (let lon = 0; lon < lonCount; lon++) {
      const phi = (lon / lonCount) * Math.PI * 2;
      points.push({
        lat,
        lon,
        theta,
        phi,
        base: {
          x: Math.sin(theta) * Math.cos(phi),
          y: Math.cos(theta),
          z: Math.sin(theta) * Math.sin(phi)
        }
      });
    }
  }

  // ---------- Animation state ----------
  let time = 0;
  let rotX = 0.25;
  let rotY = 0;
  let targetAmp = 0;
  let currentAmp = 0;
  let pulse = 0;

  function updatePhysics(dt) {
    time += dt;
    targetAmp = state.amplitude || 0;
    currentAmp += (targetAmp - currentAmp) * 6 * dt;
    pulse += (currentAmp - pulse) * 4 * dt;

    // near-silent: rotate very slowly so the sphere stays visually stable
    const speed = 0.04 + currentAmp * 0.6;
    rotY += speed * dt;
    rotX += 0.02 * dt;
  }

  function waveDisplacement(theta, phi, t) {
    // multiple sine waves moving across the sphere surface
    const w1 = Math.sin(theta * 3 + phi * 2 - t * 2.2);
    const w2 = Math.sin(theta * 5 - phi * 3 + t * 1.7);
    const w3 = Math.sin(phi * 4 + theta * 2 - t * 1.2);
    return (w1 + w2 * 0.6 + w3 * 0.35) / 2;
  }

  function buildFrame() {
    // silent → near-zero displacement so the sphere stays close to a perfect ball;
    // only ramp up distortion with audio input
    const amp = 0.015 + currentAmp * 0.65;
    const projected = [];

    for (let i = 0; i < points.length; i++) {
      const p = points[i];
      const wave = waveDisplacement(p.theta, p.phi, time);
      const r = orbRadius * (1 + wave * amp * (0.5 + pulse * 1.3));

      let x = p.base.x * r;
      let y = p.base.y * r;
      let z = p.base.z * r;

      let r1 = rotateY(x, y, z, rotY);
      let r2 = rotateX(r1.x, r1.y, r1.z, rotX);

      const proj = project(r2);
      projected.push({
        x: proj.x,
        y: proj.y,
        z: proj.z,
        scale: proj.scale,
        wave: wave,
        lat: p.lat,
        lon: p.lon,
        idx: i
      });
    }
    return projected;
  }

  // ---------- Rendering ----------
  const CYAN = '0,234,255';
  const DEEP = '0,80,110';

  function clear() {
    ctx.fillStyle = '#000000';
    ctx.fillRect(0, 0, width, height);
  }

  function drawRim(projected) {
    // outer glow as a radial gradient ring — no connecting lines between points
    const inner = orbRadius * 0.82;
    const outer = orbRadius * 1.12;
    const g = ctx.createRadialGradient(cx, cy, inner, cx, cy, outer);
    const a = 0.18 + pulse * 0.45;
    g.addColorStop(0, 'rgba(0,0,0,0)');
    g.addColorStop(0.45, `rgba(${CYAN}, ${a * 0.4})`);
    g.addColorStop(0.7, `rgba(${CYAN}, ${a})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, outer, 0, Math.PI * 2);
    ctx.fill();

    // brighten silhouette edge dots individually (no stroke between them)
    for (let i = 0; i < projected.length; i++) {
      const p = projected[i];
      if (Math.abs(p.z) < orbRadius * 0.22 && p.z > -orbRadius * 0.08) {
        const s = (1.4 + pulse * 2.2) * p.scale;
        ctx.beginPath();
        ctx.arc(p.x, p.y, s, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${CYAN}, ${0.7 + pulse * 0.3})`;
        ctx.shadowBlur = 8 + pulse * 14;
        ctx.shadowColor = `rgba(${CYAN}, .9)`;
        ctx.fill();
      }
    }
    ctx.shadowBlur = 0;
  }

  function drawMesh(projected) {
    // sort by depth (back to front)
    const order = projected.map((p, i) => ({ p, i })).sort((a, b) => a.p.z - b.p.z);

    // draw points with depth and wave highlight
    for (const { p } of order) {
      const depth = (p.z + orbRadius) / (orbRadius * 2);
      const baseAlpha = 0.15 + depth * 0.55;
      const waveBright = Math.max(0, p.wave * 0.55);
      const alpha = Math.min(0.95, baseAlpha + waveBright + pulse * 0.5);
      const size = (0.7 + depth * 1.2 + waveBright * 1.5 + pulse * 1.2) * p.scale;

      ctx.beginPath();
      ctx.arc(p.x, p.y, Math.max(0.4, size), 0, Math.PI * 2);
      ctx.fillStyle = `rgba(${CYAN}, ${alpha})`;
      ctx.fill();

      if (waveBright + pulse > 0.35) {
        ctx.beginPath();
        ctx.arc(p.x, p.y, Math.max(0.6, size * 2), 0, Math.PI * 2);
        ctx.fillStyle = `rgba(${CYAN}, ${(waveBright + pulse * 0.5) * 0.18})`;
        ctx.fill();
      }
    }
  }

  function drawBloom() {
    // soft radial glow behind the sphere
    const r = orbRadius * 1.35;
    const g = ctx.createRadialGradient(cx, cy, orbRadius * 0.5, cx, cy, r);
    g.addColorStop(0, `rgba(${CYAN}, ${0.08 + pulse * 0.18})`);
    g.addColorStop(0.5, `rgba(${CYAN}, ${0.03 + pulse * 0.08})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  function drawCore() {
    // dark blue inner core
    const r = orbRadius * 0.55;
    const g = ctx.createRadialGradient(cx, cy, 0, cx, cy, r);
    g.addColorStop(0, `rgba(${DEEP}, ${0.18 + pulse * 0.25})`);
    g.addColorStop(0.6, `rgba(${DEEP}, ${0.05 + pulse * 0.1})`);
    g.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.fill();
  }

  // ---------- Loop ----------
  let last = performance.now();
  function frame(now) {
    const dt = Math.min((now - last) / 1000, 0.05);
    last = now;

    updatePhysics(dt);
    clear();
    drawBloom();
    drawCore();

    const projected = buildFrame();
    drawMesh(projected);
    drawRim(projected);

    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  // ---------- SSE / Backend ----------
  function setStatus(status) {
    state.status = status;
    statusText.textContent = STATUS_TEXT[status] || status;
    statusLine.classList.toggle('active', status !== 'offline' && status !== 'connecting');

    if (status === 'listening') statusDot.style.background = '#00eaff';
    else if (status === 'receiving' || status === 'speaking') statusDot.style.background = '#00f5d4';
    else if (status === 'paused' || status === 'offline') statusDot.style.background = '#6a7a7d';
    else statusDot.style.background = '#00eaff';
  }

  function connectSSE() {
    const es = new EventSource('/events');
    es.addEventListener('state', e => {
      try {
        const data = JSON.parse(e.data);
        if (data.status) setStatus(data.status);
        if (typeof data.enabled === 'boolean') state.enabled = data.enabled;
        toggleBtn.textContent = state.enabled ? '暂停' : '继续';
      } catch (_) {}
    });
    es.addEventListener('level', e => {
      try {
        const data = JSON.parse(e.data);
        state.amplitude = Math.max(0, Math.min(1, data.amplitude || 0));
        state.tone = data.tone || 0;
        state.speaking = !!data.speaking;
      } catch (_) {}
    });
    es.onerror = () => {
      setStatus('offline');
      es.close();
      setTimeout(connectSSE, 2000);
    };
  }

  function sendControl(payload) {
    fetch('/control', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).catch(() => {});
  }

  toggleBtn.addEventListener('click', () => {
    state.enabled = !state.enabled;
    sendControl({ enabled: state.enabled });
    toggleBtn.textContent = state.enabled ? '暂停' : '继续';
    setStatus(state.enabled ? 'listening' : 'paused');
  });

  exitBtn.addEventListener('click', () => {
    sendControl({ action: 'shutdown' });
  });

  // SiriOrb compat
  window.SiriOrb = {
    setStatus,
    setAmplitude: v => { state.amplitude = Math.max(0, Math.min(1, v)); }
  };

  setStatus('connecting');
  connectSSE();
})();
</script>
</body>
</html>
