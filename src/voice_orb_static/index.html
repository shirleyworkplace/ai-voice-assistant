<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#02030a">
  <title>Ava</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #02030a;
    }

    * { box-sizing: border-box; }

    html, body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #02030a;
    }

    body {
      min-height: 100svh;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    #orb-canvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      cursor: pointer;
      touch-action: manipulation;
    }

    .chrome {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: max(24px, env(safe-area-inset-top)) max(24px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(24px, env(safe-area-inset-left));
      pointer-events: none;
    }

    .masthead {
      display: flex;
      align-items: center;
      justify-content: space-between;
      color: rgba(255, 255, 255, .66);
      font-size: 11px;
      font-weight: 650;
      letter-spacing: 0;
      text-transform: uppercase;
    }

    .wordmark {
      display: flex;
      align-items: center;
      gap: 9px;
    }

    .wordmark::before {
      content: "";
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #7ef9ff;
      box-shadow: 0 0 14px rgba(126, 249, 255, .85);
    }

    .status {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 7px;
      min-width: 82px;
      color: rgba(255, 255, 255, .38);
    }

    .status-dot {
      width: 5px;
      height: 5px;
      border-radius: 50%;
      background: currentColor;
      transition: color 240ms ease, box-shadow 240ms ease;
    }

    .status.live { color: #7ef9ff; }
    .status.live .status-dot { box-shadow: 0 0 11px rgba(126, 249, 255, .92); }
    .status.speaking { color: #ff9bcb; }
    .status.speaking .status-dot { box-shadow: 0 0 13px rgba(255, 155, 203, .95); }

    .controls-wrap {
      display: flex;
      justify-content: center;
      width: 100%;
    }

    .controls {
      pointer-events: auto;
      display: grid;
      grid-template-columns: 44px minmax(110px, 190px) 44px 44px;
      align-items: center;
      gap: 12px;
      min-height: 60px;
      padding: 8px;
      border: 1px solid rgba(255, 255, 255, .12);
      border-radius: 8px;
      background: rgba(8, 10, 19, .58);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .34), inset 0 1px 0 rgba(255, 255, 255, .05);
      backdrop-filter: blur(20px) saturate(130%);
      -webkit-backdrop-filter: blur(20px) saturate(130%);
    }

    .icon-button {
      position: relative;
      display: grid;
      place-items: center;
      width: 44px;
      height: 44px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, .11);
      border-radius: 6px;
      color: rgba(255, 255, 255, .72);
      background: rgba(255, 255, 255, .045);
      cursor: pointer;
      transition: transform 140ms ease, color 180ms ease, background 180ms ease, border-color 180ms ease;
    }

    .icon-button:hover {
      color: white;
      border-color: rgba(255, 255, 255, .2);
      background: rgba(255, 255, 255, .09);
    }

    .icon-button:active { transform: scale(.92); }
    .icon-button:focus-visible, .amplitude:focus-visible { outline: 2px solid #7ec8ff; outline-offset: 3px; }
    .icon-button.active {
      color: #071014;
      border-color: rgba(126, 249, 255, .82);
      background: #8df9f5;
      box-shadow: 0 0 22px rgba(126, 249, 255, .36);
    }

    .icon-button.exit-button:hover {
      color: #fff4f7;
      border-color: rgba(255, 116, 164, .55);
      background: rgba(255, 91, 148, .17);
    }

    .icon-button svg { width: 19px; height: 19px; stroke-width: 1.8; }

    .level-control {
      display: grid;
      grid-template-columns: 18px 1fr;
      align-items: center;
      gap: 9px;
      min-width: 0;
      padding: 0 4px;
      color: rgba(255, 255, 255, .42);
    }

    .level-control svg { width: 18px; height: 18px; }

    .amplitude {
      width: 100%;
      height: 24px;
      margin: 0;
      appearance: none;
      -webkit-appearance: none;
      background: transparent;
      cursor: ew-resize;
    }

    .amplitude::-webkit-slider-runnable-track {
      height: 2px;
      border-radius: 1px;
      background: linear-gradient(90deg, #7ef9ff 0 var(--level, 22%), rgba(255,255,255,.13) var(--level, 22%) 100%);
    }

    .amplitude::-moz-range-track { height: 2px; background: rgba(255,255,255,.13); }
    .amplitude::-moz-range-progress { height: 2px; background: #7ef9ff; }
    .amplitude::-webkit-slider-thumb {
      width: 12px;
      height: 12px;
      margin-top: -5px;
      border: 0;
      border-radius: 50%;
      appearance: none;
      -webkit-appearance: none;
      background: #f2ffff;
      box-shadow: 0 0 13px rgba(126, 249, 255, .62);
    }

    .amplitude::-moz-range-thumb {
      width: 12px;
      height: 12px;
      border: 0;
      border-radius: 50%;
      background: #f2ffff;
    }

    .error {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      padding: 30px;
      color: rgba(255,255,255,.72);
      background: #02030a;
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    @media (max-width: 540px) {
      .chrome { padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left)); }
      .controls { grid-template-columns: 44px minmax(80px, 1fr) 44px 44px; width: min(100%, 370px); }
      .masthead { font-size: 10px; }
    }

    @media (prefers-reduced-motion: reduce) {
      .icon-button { transition: none; }
    }
  </style>
</head>
<body>
  <canvas id="orb-canvas" aria-label="Voice orb"></canvas>

  <div class="chrome">
    <header class="masthead">
      <div class="wordmark">Ava</div>
      <div class="status" id="status" aria-live="polite">
        <span class="status-dot"></span>
        <span id="status-label">IDLE</span>
      </div>
    </header>

    <div class="controls-wrap">
      <div class="controls" aria-label="Voice orb controls">
        <button class="icon-button active" id="mic-button" type="button" title="Voice capture" aria-label="Disable voice capture" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3Z"/>
            <path d="M19 10v2a7 7 0 0 1-14 0v-2M12 19v3"/>
          </svg>
        </button>

        <label class="level-control" title="Amplitude">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M4 14v-4M8 17V7M12 20V4M16 17V7M20 14v-4"/>
          </svg>
          <input class="amplitude" id="amplitude" type="range" min="0" max="1" step="0.01" value="0.22" aria-label="External audio amplitude">
        </label>

        <button class="icon-button active" id="motion-button" type="button" title="Motion" aria-label="Toggle motion" aria-pressed="true">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M3 12h3l2.2-6 4 12 2.4-8 2 5H21"/>
          </svg>
        </button>
        <button class="icon-button exit-button" id="exit-button" type="button" title="Close voice assistant" aria-label="Close voice assistant">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M12 2v10"/>
            <path d="M6.2 5.5a8 8 0 1 0 11.6 0"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <div class="error" id="error">WebGL2 is not available. The voice orb cannot be rendered.</div>

  <script>
    (() => {
      'use strict';

      const canvas = document.getElementById('orb-canvas');
      const error = document.getElementById('error');
      const micButton = document.getElementById('mic-button');
      const motionButton = document.getElementById('motion-button');
      const exitButton = document.getElementById('exit-button');
      const amplitudeSlider = document.getElementById('amplitude');
      const status = document.getElementById('status');
      const statusLabel = document.getElementById('status-label');
      const gl = canvas.getContext('webgl2', {
        alpha: false,
        antialias: false,
        depth: false,
        stencil: false,
        powerPreference: 'high-performance'
      });

      if (!gl) {
        error.style.display = 'grid';
        return;
      }

      const fullscreenVertex = `#version 300 es
        precision highp float;
        const vec2 POSITIONS[3] = vec2[3](
          vec2(-1.0, -1.0), vec2(3.0, -1.0), vec2(-1.0, 3.0)
        );
        out vec2 vUv;
        void main() {
          vec2 p = POSITIONS[gl_VertexID];
          vUv = p * 0.5 + 0.5;
          gl_Position = vec4(p, 0.0, 1.0);
        }
      `;

      const sceneFragment = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 outColor;

        uniform vec2 uResolution;
        uniform vec2 uPointer;
        uniform float uTime;
        uniform float uAmplitude;
        uniform float uBass;
        uniform float uMid;
        uniform float uTreble;
        uniform float uActivity;
        uniform float uTap;
        uniform float uMotion;

        #define PI 3.14159265359

        float hash31(vec3 p) {
          p = fract(p * 0.1031);
          p += dot(p, p.yzx + 33.33);
          return fract((p.x + p.y) * p.z);
        }

        float noise3(vec3 p) {
          vec3 i = floor(p);
          vec3 f = fract(p);
          f = f * f * (3.0 - 2.0 * f);
          return mix(
            mix(mix(hash31(i), hash31(i + vec3(1,0,0)), f.x),
                mix(hash31(i + vec3(0,1,0)), hash31(i + vec3(1,1,0)), f.x), f.y),
            mix(mix(hash31(i + vec3(0,0,1)), hash31(i + vec3(1,0,1)), f.x),
                mix(hash31(i + vec3(0,1,1)), hash31(i + vec3(1,1,1)), f.x), f.y), f.z);
        }

        mat3 octaveRotation() {
          return mat3(
             0.00,  0.80,  0.60,
            -0.80,  0.36, -0.48,
            -0.60, -0.48,  0.64
          );
        }

        float fbm3(vec3 p) {
          float value = 0.0;
          float weight = 0.56;
          mat3 rot = octaveRotation();
          for (int i = 0; i < 3; i++) {
            value += weight * noise3(p);
            p = rot * p * 2.03 + vec3(0.17, 0.11, -0.13);
            weight *= 0.49;
          }
          return value;
        }

        float fbm4(vec3 p) {
          float value = 0.0;
          float weight = 0.54;
          mat3 rot = octaveRotation();
          for (int i = 0; i < 4; i++) {
            value += weight * noise3(p);
            p = rot * p * 2.01 + vec3(-0.12, 0.16, 0.09);
            weight *= 0.5;
          }
          return value;
        }

        mat2 rotate2(float a) {
          float s = sin(a), c = cos(a);
          return mat2(c, -s, s, c);
        }

        float softBand(float value, float width) {
          float x = value / max(width, 0.001);
          return exp(-x * x);
        }

        vec3 palette(float phase) {
          vec3 blue = vec3(0.494, 0.784, 1.000);
          vec3 purple = vec3(0.718, 0.612, 1.000);
          vec3 pink = vec3(1.000, 0.608, 0.796);
          vec3 cyan = vec3(0.494, 0.976, 1.000);
          float x = fract(phase) * 4.0;
          if (x < 1.0) return mix(blue, purple, smoothstep(0.0, 1.0, x));
          if (x < 2.0) return mix(purple, pink, smoothstep(0.0, 1.0, x - 1.0));
          if (x < 3.0) return mix(pink, cyan, smoothstep(0.0, 1.0, x - 2.0));
          return mix(cyan, blue, smoothstep(0.0, 1.0, x - 3.0));
        }

        vec3 fluidLayer(vec3 p, float phase, float t, out float density) {
          float warpStrength = 0.38;
          vec3 base = p * (1.48 + phase * 0.11);
          float warpA = fbm3(base + vec3(t * 0.34, -t * 0.22, phase * 2.7));
          float warpB = fbm3(base.zxy * 1.13 + vec3(-t * 0.19, phase * 1.8, t * 0.29));
          p += vec3(warpA - 0.48, warpB - 0.48, warpA - warpB) * warpStrength;

          float detail = fbm4(p * 2.16 + vec3(t * 0.26, -t * 0.31, phase));
          float angle = atan(p.y, p.x);
          float helix = p.y + 0.24 * sin(angle * 2.0 + p.z * 2.4 - t * 0.72 + phase * 4.2);
          helix += (detail - 0.48) * (0.58 + uMid * 0.24);
          float sweep = dot(p, normalize(vec3(0.68, -0.39, 0.62)));
          sweep += 0.19 * sin(angle * 3.0 - p.z * 3.1 + t * 0.54 + phase * 5.6);
          sweep += (warpB - 0.5) * 0.52;
          float curl = p.x * p.y + 0.24 * sin(p.z * 4.0 + angle * 2.0 - t * 0.47);
          curl += (detail - 0.5) * 0.36;

          float width = 0.112;
          float a = softBand(helix - (phase - 0.5) * 0.50, width);
          float b = softBand(sweep + (phase - 0.5) * 0.42, width * 1.08);
          float c = softBand(curl - 0.06 * sin(phase * 12.0 + t), width * 0.82);
          a *= 0.56 + detail * 0.72;
          b *= 0.52 + warpA * 0.74;
          c *= 0.36 + warpB * 0.56;

          float hueDrift = t * 0.018 + 0.035 * sin(t * 0.17);
          vec3 color = palette(phase + hueDrift) * a;
          color += palette(phase + 0.25 + hueDrift) * b;
          color += palette(phase + 0.57 - hueDrift) * c * 0.72;
          density = clamp((a + b + c * 0.65) * 0.58, 0.0, 1.0);
          return color;
        }

        void main() {
          vec2 frag = vUv * uResolution;
          vec2 p = (frag * 2.0 - uResolution) / min(uResolution.x, uResolution.y);
          float portrait = smoothstep(1.12, 1.58, uResolution.y / uResolution.x);
          float centerY = mix(0.025, 0.085, portrait);
          p.y -= centerY;

          float motionRate = mix(0.14, 1.0, uMotion);
          float timeWarp = uTime + sin(uTime * 0.19) * 0.72 + sin(uTime * 0.071 + 1.7) * 0.48;
          float t = timeWarp * 0.16 * motionRate;
          float energy = pow(clamp(uAmplitude * 1.85, 0.0, 1.0), 0.54);
          float breath = (sin(uTime * 0.92) + 0.42 * sin(uTime * 0.41 + 1.3)) * 0.017;
          float bassPulse = uBass * (0.030 + 0.012 * sin(uTime * 1.8));
          float tapPulse = uTap * (0.028 + 0.018 * sin(uTime * 20.0));
          float radius = 0.35 + portrait * 0.135 + breath + bassPulse + energy * 0.045 + tapPulse;

          float d = length(p);
          float q = d / radius;

          vec2 bgUv = (vUv - 0.5) * vec2(uResolution.x / uResolution.y, 1.0);
          float bgRadial = exp(-dot(bgUv - vec2(0.0, 0.03), bgUv - vec2(0.0, 0.03)) * 2.25);
          vec3 color = mix(vec3(0.0015, 0.002, 0.006), vec3(0.013, 0.018, 0.058), bgRadial);
          color += vec3(0.018, 0.007, 0.036) * exp(-dot(bgUv + vec2(0.19, -0.04), bgUv + vec2(0.19, -0.04)) * 5.5);

          float bloomMask = 0.0;

          float edgeAA = 2.2 / min(uResolution.x, uResolution.y) / radius;
          float sphereMask = 1.0 - smoothstep(1.0 - edgeAA, 1.0 + edgeAA, q);

          if (q < 1.025) {
            vec2 xy = p / radius;
            float zExtent = sqrt(max(0.0, 1.0 - dot(xy, xy)));
            vec3 normal = normalize(vec3(xy, zExtent));

            vec3 volume = vec3(0.0);
            float transmittance = 1.0;
            for (int i = 0; i < 4; i++) {
              float fi = float(i);
              float slice = -0.72 + fi * 0.48;
              vec3 samplePos = vec3(xy, slice * zExtent);
              samplePos.xz *= rotate2(t * (0.47 + fi * 0.035) + uPointer.x * 0.20);
              samplePos.yz *= rotate2(-t * (0.31 + fi * 0.027) - uPointer.y * 0.16);
              samplePos.xy *= rotate2(sin(t * 0.26 + fi) * 0.24);
              float density;
              vec3 layer = fluidLayer(samplePos, fi * 0.233 + 0.07, t + fi * 0.41, density);
              float depthWeight = (0.18 + zExtent * 0.16) * (0.84 + fi * 0.08);
              volume += layer * density * depthWeight * transmittance;
              transmittance *= 1.0 - density * 0.14;
            }

            vec3 innerPos = vec3(xy, zExtent * 0.35);
            float mistNoise = fbm3(innerPos * 2.3 + vec3(-t * 0.18, t * 0.14, t * 0.11));
            vec3 glassBody = mix(vec3(0.010, 0.022, 0.060), vec3(0.055, 0.022, 0.095), mistNoise);
            glassBody *= 0.50 + zExtent * 0.48;
            glassBody += palette(mistNoise * 0.35 + t * 0.008) * pow(mistNoise, 2.1) * 0.15;

            vec2 coreOffset = xy - vec2(0.025 * sin(t * 1.5), -0.018 + 0.018 * cos(t * 1.1));
            coreOffset.x *= 1.04 - uBass * 0.08;
            float coreSize = mix(13.5, 9.0, energy) - uActivity * 0.4;
            float core = exp(-dot(coreOffset, coreOffset) * coreSize);
            float coreHalo = exp(-dot(coreOffset, coreOffset) * (4.5 - energy * 0.30));
            float hotCore = pow(core, 5.8) * (0.72 + energy * 0.55 + uTreble * 0.24);
            float flicker = 1.0 + uTreble * uActivity * 0.018 * sin(uTime * 2.1);
            vec3 coreColor = vec3(0.58, 0.76, 1.0) * coreHalo * (0.14 + energy * 0.12);
            vec3 coreAurora = palette(t * 0.035 + xy.x * 0.42 - xy.y * 0.28);
            coreColor += coreAurora * coreHalo * (0.10 + energy * 0.16);
            coreColor += vec3(0.84, 0.93, 1.0) * core * (0.45 + energy * 0.30);
            coreColor += vec3(1.0, 0.985, 1.0) * hotCore * 0.76 * flicker;

            float currentA = xy.y - 0.16 * sin(xy.x * 5.2 - t * 1.8)
                            - 0.055 * sin(xy.x * 14.0 - t * 3.7);
            float currentB = xy.x + 0.13 * cos(xy.y * 4.6 + t * 1.4)
                            + 0.045 * sin(xy.y * 16.0 + t * 3.2);
            float currentC = xy.y + xy.x * 0.48 - 0.12 * sin(xy.x * 7.0 + t * 2.3);
            float currentFlicker = smoothstep(0.18, 0.82,
              0.5 + 0.5 * sin(xy.x * 20.0 + xy.y * 9.0 - t * 5.0));
            float current = softBand(currentA, 0.014 + uTreble * 0.004)
                          * (0.55 + currentFlicker * 0.45);
            current += softBand(currentB, 0.016) * (0.38 + uMid * 0.42);
            current += softBand(currentC, 0.012) * (0.30 + uActivity * 0.55);
            current *= smoothstep(0.08, 0.52, zExtent) * (0.62 + energy * 1.05);
            vec3 electricColor = mix(vec3(0.18, 0.86, 1.0), vec3(0.78, 0.42, 1.0),
              0.5 + 0.5 * sin(t * 0.55 + xy.x * 2.0));
            vec3 electric = electricColor * current;

            vec3 lightDir = normalize(vec3(-0.42, 0.67, 0.61));
            vec3 viewDir = vec3(0.0, 0.0, 1.0);
            vec3 halfDir = normalize(lightDir + viewDir);
            float diffuse = max(dot(normal, lightDir), 0.0);
            float specular = pow(max(dot(normal, halfDir), 0.0), 46.0);
            float pinSpecular = pow(max(dot(normal, normalize(vec3(0.36, 0.72, 0.59))), 0.0), 150.0);
            float fresnel = pow(1.0 - max(dot(normal, viewDir), 0.0), 2.35);
            vec3 rim = mix(vec3(0.25, 0.72, 1.0), vec3(0.72, 0.45, 1.0), 0.5 + 0.5 * normal.y);
            rim *= fresnel * (0.72 + mistNoise * 0.38);
            vec3 reflection = vec3(0.66, 0.88, 1.0) * specular * 0.74;
            reflection += vec3(1.0, 0.92, 1.0) * pinSpecular * 0.68;
            reflection += vec3(0.10, 0.17, 0.30) * diffuse * 0.24;

            vec3 sphere = glassBody + volume * (0.88 + energy * 0.40) + coreColor + electric + rim + reflection;
            sphere *= 0.74 + zExtent * 0.31;
            color = mix(color, sphere, sphereMask);

            float boundary = exp(-pow((q - 0.988) * 48.0, 2.0));
            vec3 edgeGlow = mix(vec3(0.22, 0.70, 1.0), vec3(0.68, 0.43, 1.0), 0.5 + 0.5 * sin(atan(xy.y, xy.x) + t * 0.3));
            color += edgeGlow * boundary * (0.58 + fresnel * 1.05) * sphereMask;
          }

          float vignette = 1.0 - smoothstep(0.24, 1.18, length(bgUv));
          color *= 0.83 + vignette * 0.17;
          outColor = vec4(max(color, 0.0), 0.0);
        }
      `;

      const particleVertex = `#version 300 es
        precision highp float;
        uniform vec2 uResolution;
        uniform float uPixelRatio;
        uniform float uTime;
        uniform float uOrbRadius;
        uniform float uCenterY;
        uniform float uAmplitude;
        uniform float uBass;
        uniform float uTreble;
        uniform float uActivity;
        uniform float uMotion;
        out float vAlpha;
        out float vHue;
        out float vAngle;

        float hash11(float p) {
          p = fract(p * 0.1031);
          p *= p + 33.33;
          p *= p + p;
          return fract(p);
        }

        void main() {
          float id = float(gl_VertexID);
          float seed = hash11(id + 7.13);
          float seed2 = hash11(id * 2.17 + 19.7);
          float direction = mod(id, 3.0) < 1.0 ? -1.0 : 1.0;
          float motionRate = mix(0.12, 1.0, uMotion);
          float energy = pow(clamp(uAmplitude * 1.8, 0.0, 1.0), 0.60);
          float sector = 6.2831853 / 18.0;
          float angle = (id + 0.5) * sector + (seed - 0.5) * 0.16
                      + direction * uTime * (0.18 + seed2 * 0.25 + uActivity * 0.16) * motionRate;
          angle += 0.12 * sin(uTime * 0.21 + id * 1.7);
          float radial = uOrbRadius * (1.10 + seed2 * 0.14 + energy * 0.045);
          vec2 p = vec2(cos(angle), sin(angle)) * radial;
          p.y *= 0.88 + seed * 0.12;
          p.y += uCenterY + sin(uTime * (0.12 + seed * 0.10) + id) * 0.012;
          p.x += cos(uTime * 0.16 + id * 2.4) * 0.010;

          float minRes = min(uResolution.x, uResolution.y);
          vec2 clip = p * minRes / uResolution;
          gl_Position = vec4(clip, 0.0, 1.0);
          float pulse = 0.72 + 0.28 * sin(uTime * (1.2 + seed * 2.8) + id * 4.1);
          float audioSpark = 0.72 + uTreble * (0.9 + seed * 0.8) + uActivity * 0.35;
          gl_PointSize = uPixelRatio * (24.0 + seed * 16.0) * audioSpark;
          vAlpha = (0.38 + seed * 0.30) * pulse * (0.82 + energy * 0.92);
          vHue = fract(seed + uTime * 0.006 + uAmplitude * 0.08);
          vAngle = angle + 1.5707963;
        }
      `;

      const particleFragment = `#version 300 es
        precision highp float;
        in float vAlpha;
        in float vHue;
        in float vAngle;
        out vec4 outColor;
        void main() {
          vec2 p = gl_PointCoord * 2.0 - 1.0;
          float c = cos(vAngle), s = sin(vAngle);
          vec2 trail = vec2(c * p.x - s * p.y, s * p.x + c * p.y);
          float along = trail.x;
          float across = trail.y;
          float tail = smoothstep(-0.98, -0.72, along) * (1.0 - smoothstep(0.42, 0.98, along));
          float head = exp(-dot(vec2(along - 0.54, across * 5.5), vec2(along - 0.54, across * 5.5)) * 12.0);
          float meteor = clamp(tail * smoothstep(0.10, 0.010, abs(across)) + head, 0.0, 1.0);
          if (meteor < 0.02) discard;
          vec3 blue = vec3(0.494, 0.784, 1.0);
          vec3 pink = vec3(1.0, 0.608, 0.796);
          vec3 cyan = vec3(0.494, 0.976, 1.0);
          vec3 color = vHue < 0.42 ? mix(blue, cyan, vHue / 0.42) : mix(cyan, pink, (vHue - 0.42) / 0.58);
          outColor = vec4(color * meteor * vAlpha, meteor * vAlpha);
        }
      `;

      const extractFragment = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 outColor;
        uniform sampler2D uTexture;
        void main() {
          vec4 scene = texture(uTexture, vUv);
          float luma = dot(scene.rgb, vec3(0.2126, 0.7152, 0.0722));
          float bright = smoothstep(0.42, 1.05, luma) * 0.48 + scene.a * 1.12;
          outColor = vec4(scene.rgb * bright, 1.0);
        }
      `;

      const blurFragment = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 outColor;
        uniform sampler2D uTexture;
        uniform vec2 uTexel;
        uniform vec2 uDirection;
        void main() {
          vec2 stepUv = uTexel * uDirection;
          vec3 color = texture(uTexture, vUv).rgb * 0.227027;
          color += texture(uTexture, vUv + stepUv * 1.384615).rgb * 0.316216;
          color += texture(uTexture, vUv - stepUv * 1.384615).rgb * 0.316216;
          color += texture(uTexture, vUv + stepUv * 3.230769).rgb * 0.070270;
          color += texture(uTexture, vUv - stepUv * 3.230769).rgb * 0.070270;
          outColor = vec4(color, 1.0);
        }
      `;

      const compositeFragment = `#version 300 es
        precision highp float;
        in vec2 vUv;
        out vec4 outColor;
        uniform sampler2D uScene;
        uniform sampler2D uBloom;
        uniform vec2 uResolution;
        uniform float uTime;
        uniform float uAmplitude;

        float hash12(vec2 p) {
          vec3 p3 = fract(vec3(p.xyx) * 0.1031);
          p3 += dot(p3, p3.yzx + 33.33);
          return fract((p3.x + p3.y) * p3.z);
        }

        void main() {
          vec3 scene = texture(uScene, vUv).rgb;
          vec3 bloom = texture(uBloom, vUv).rgb;
          vec2 px = 1.0 / uResolution;
          vec3 wideBloom = texture(uBloom, vUv + vec2(px.x * 8.0, 0.0)).rgb;
          wideBloom += texture(uBloom, vUv - vec2(px.x * 8.0, 0.0)).rgb;
          wideBloom += texture(uBloom, vUv + vec2(0.0, px.y * 8.0)).rgb;
          wideBloom += texture(uBloom, vUv - vec2(0.0, px.y * 8.0)).rgb;
          wideBloom *= 0.25;
          vec3 hdr = scene;
          vec3 color = 1.0 - exp(-hdr * 1.16);
          color = pow(max(color, 0.0), vec3(0.92));
          float grain = hash12(gl_FragCoord.xy + mod(uTime, 10.0) * 97.0) - 0.5;
          color += grain * 0.008;
          outColor = vec4(clamp(color, 0.0, 1.0), 1.0);
        }
      `;

      function compileShader(type, source, label) {
        const shader = gl.createShader(type);
        gl.shaderSource(shader, source);
        gl.compileShader(shader);
        if (!gl.getShaderParameter(shader, gl.COMPILE_STATUS)) {
          const message = gl.getShaderInfoLog(shader) || 'Unknown shader error';
          gl.deleteShader(shader);
          throw new Error(`${label}: ${message}`);
        }
        return shader;
      }

      function createProgram(vertexSource, fragmentSource, label) {
        const program = gl.createProgram();
        const vertex = compileShader(gl.VERTEX_SHADER, vertexSource, `${label} vertex shader`);
        const fragment = compileShader(gl.FRAGMENT_SHADER, fragmentSource, `${label} fragment shader`);
        gl.attachShader(program, vertex);
        gl.attachShader(program, fragment);
        gl.linkProgram(program);
        gl.deleteShader(vertex);
        gl.deleteShader(fragment);
        if (!gl.getProgramParameter(program, gl.LINK_STATUS)) {
          const message = gl.getProgramInfoLog(program) || 'Unknown link error';
          gl.deleteProgram(program);
          throw new Error(`${label}: ${message}`);
        }
        return program;
      }

      function uniformMap(program, names) {
        const result = {};
        names.forEach(name => { result[name] = gl.getUniformLocation(program, name); });
        return result;
      }

      let programs;
      try {
        programs = {
          scene: createProgram(fullscreenVertex, sceneFragment, 'Scene'),
          particles: createProgram(particleVertex, particleFragment, 'Particles'),
          extract: createProgram(fullscreenVertex, extractFragment, 'Bloom extract'),
          blur: createProgram(fullscreenVertex, blurFragment, 'Bloom blur'),
          composite: createProgram(fullscreenVertex, compositeFragment, 'Composite')
        };
      } catch (shaderError) {
        console.error(shaderError);
        error.textContent = 'Voice orb rendering failed. Please refresh the page.';
        error.style.display = 'grid';
        return;
      }

      const uniforms = {
        scene: uniformMap(programs.scene, ['uResolution', 'uPointer', 'uTime', 'uAmplitude', 'uBass', 'uMid', 'uTreble', 'uActivity', 'uTap', 'uMotion']),
        particles: uniformMap(programs.particles, ['uResolution', 'uPixelRatio', 'uTime', 'uOrbRadius', 'uCenterY', 'uAmplitude', 'uBass', 'uTreble', 'uActivity', 'uMotion']),
        extract: uniformMap(programs.extract, ['uTexture']),
        blur: uniformMap(programs.blur, ['uTexture', 'uTexel', 'uDirection']),
        composite: uniformMap(programs.composite, ['uScene', 'uBloom', 'uResolution', 'uTime', 'uAmplitude'])
      };

      const vao = gl.createVertexArray();
      gl.bindVertexArray(vao);

      const targets = {
        scene: null,
        bloomA: null,
        bloomB: null,
        width: 0,
        height: 0,
        bloomWidth: 0,
        bloomHeight: 0
      };

      function createTarget(width, height) {
        const texture = gl.createTexture();
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
        gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
        gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA8, width, height, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
        const framebuffer = gl.createFramebuffer();
        gl.bindFramebuffer(gl.FRAMEBUFFER, framebuffer);
        gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, texture, 0);
        if (gl.checkFramebufferStatus(gl.FRAMEBUFFER) !== gl.FRAMEBUFFER_COMPLETE) {
          throw new Error('Framebuffer is incomplete');
        }
        return { texture, framebuffer };
      }

      function destroyTarget(target) {
        if (!target) return;
        gl.deleteTexture(target.texture);
        gl.deleteFramebuffer(target.framebuffer);
      }

      function resizeTargets(width, height) {
        if (targets.width === width && targets.height === height) return;
        destroyTarget(targets.scene);
        destroyTarget(targets.bloomA);
        destroyTarget(targets.bloomB);
        targets.width = width;
        targets.height = height;
        targets.bloomWidth = Math.max(1, Math.round(width * 0.42));
        targets.bloomHeight = Math.max(1, Math.round(height * 0.42));
        targets.scene = createTarget(width, height);
        targets.bloomA = createTarget(targets.bloomWidth, targets.bloomHeight);
        targets.bloomB = createTarget(targets.bloomWidth, targets.bloomHeight);
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
      }

      const state = {
        targetAmplitude: 0.22,
        amplitude: 0.22,
        bass: 0.24,
        mid: 0.28,
        treble: 0.18,
        targetBass: 0.24,
        targetMid: 0.28,
        targetTreble: 0.18,
        activity: 0,
        activityTarget: 0,
        speechTime: 0,
        quietTime: 0,
        pointer: { x: 0, y: 0 },
        pointerTarget: { x: 0, y: 0 },
        tap: 0,
        motion: 1,
        voiceEnabled: true,
        micActive: false,
        audioContext: null,
        analyser: null,
        stream: null,
        frequencyData: null,
        timeData: null,
        lastFrame: performance.now(),
        pixelRatio: 1
      };

      function resize() {
        const mobile = Math.min(innerWidth, innerHeight) < 700;
        const dprCap = mobile ? 1.45 : 1.75;
        const dpr = Math.min(window.devicePixelRatio || 1, dprCap);
        const width = Math.max(1, Math.floor(innerWidth * dpr));
        const height = Math.max(1, Math.floor(innerHeight * dpr));
        state.pixelRatio = dpr;
        if (canvas.width !== width || canvas.height !== height) {
          canvas.width = width;
          canvas.height = height;
          resizeTargets(width, height);
        }
      }

      function averageHz(data, sampleRate, fftSize, lowHz, highHz) {
        const binHz = sampleRate / fftSize;
        const start = Math.max(0, Math.floor(lowHz / binHz));
        const end = Math.min(data.length, Math.max(start + 1, Math.ceil(highHz / binHz)));
        let total = 0;
        for (let i = start; i < end; i++) total += data[i];
        return total / (end - start) / 255;
      }

      function readMicrophone() {
        if (!state.micActive || !state.analyser || !state.audioContext) return;
        state.analyser.getByteTimeDomainData(state.timeData);
        state.analyser.getByteFrequencyData(state.frequencyData);

        let sumSquares = 0;
        for (let i = 0; i < state.timeData.length; i++) {
          const sample = (state.timeData[i] - 128) / 128;
          sumSquares += sample * sample;
        }
        const rms = Math.sqrt(sumSquares / state.timeData.length);
        state.targetAmplitude = Math.min(1, Math.max(0, (rms - 0.009) * 9.2));
        const sampleRate = state.audioContext.sampleRate;
        const fftSize = state.analyser.fftSize;
        state.targetBass = Math.min(1, averageHz(state.frequencyData, sampleRate, fftSize, 55, 260) * 2.5);
        state.targetMid = Math.min(1, averageHz(state.frequencyData, sampleRate, fftSize, 260, 2400) * 3.0);
        state.targetTreble = Math.min(1, averageHz(state.frequencyData, sampleRate, fftSize, 2400, 9000) * 4.1);
      }

      function setStatus(label, mode = 'idle') {
        statusLabel.textContent = label;
        status.classList.toggle('live', mode === 'live');
        status.classList.toggle('speaking', mode === 'speaking');
      }

      function updateVoiceActivity(dt) {
        if (state.micActive) {
          const speaking = state.targetAmplitude > 0.075 || state.targetMid > 0.21;
          if (speaking) {
            state.speechTime += dt;
            state.quietTime = 0;
          } else {
            state.quietTime += dt;
            state.speechTime = Math.max(0, state.speechTime - dt * 1.6);
          }

          if (state.speechTime > 0.11) state.activityTarget = 1;
          if (state.quietTime > 0.46) state.activityTarget = 0;
        }
        state.activity += (state.activityTarget - state.activity) * (1 - Math.exp(-dt * (state.activityTarget ? 7.5 : 2.8)));

        if (state.micActive) {
          setStatus(state.activityTarget ? 'SPEAKING' : 'LISTENING', state.activityTarget ? 'speaking' : 'live');
        }
      }

      async function startMicrophone() {
        if (!navigator.mediaDevices?.getUserMedia) {
          setStatus('UNAVAILABLE');
          return;
        }
        try {
          const stream = await navigator.mediaDevices.getUserMedia({
            audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true }
          });
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          const context = new AudioContext();
          await context.resume();
          const source = context.createMediaStreamSource(stream);
          const analyser = context.createAnalyser();
          analyser.fftSize = 1024;
          analyser.smoothingTimeConstant = 0.84;
          source.connect(analyser);

          state.stream = stream;
          state.audioContext = context;
          state.analyser = analyser;
          state.frequencyData = new Uint8Array(analyser.frequencyBinCount);
          state.timeData = new Uint8Array(analyser.fftSize);
          state.micActive = true;
          state.activityTarget = 0;
          state.speechTime = 0;
          state.quietTime = 0;
          micButton.classList.add('active');
          micButton.setAttribute('aria-pressed', 'true');
          micButton.setAttribute('aria-label', 'Disable microphone');
          setStatus('LISTENING', 'live');
        } catch (err) {
          console.warn('Microphone unavailable:', err);
          setStatus('NO ACCESS');
          micButton.classList.remove('active');
          micButton.setAttribute('aria-pressed', 'false');
        }
      }

      function stopMicrophone() {
        state.micActive = false;
        state.stream?.getTracks().forEach(track => track.stop());
        state.audioContext?.close();
        state.stream = null;
        state.audioContext = null;
        state.analyser = null;
        state.activityTarget = 0;
        state.speechTime = 0;
        state.quietTime = 0;
        micButton.classList.remove('active');
        micButton.setAttribute('aria-pressed', 'false');
        micButton.setAttribute('aria-label', 'Disable microphone');
        state.targetAmplitude = Number(amplitudeSlider.value);
        setStatus('IDLE');
      }

      function applyVoiceEnabled(enabled) {
        state.voiceEnabled = Boolean(enabled);
        micButton.classList.toggle('active', state.voiceEnabled);
        micButton.setAttribute('aria-pressed', String(state.voiceEnabled));
        micButton.setAttribute('aria-label', state.voiceEnabled ? 'Disable voice capture' : 'Enable voice capture');
        micButton.title = state.voiceEnabled ? 'Pause voice capture' : 'Resume voice capture';
        if (!state.voiceEnabled) {
          state.targetAmplitude = 0;
          state.targetBass = 0;
          state.targetMid = 0;
          state.targetTreble = 0;
          state.activityTarget = 0;
          setStatus('PAUSED');
        }
      }

      async function setVoiceEnabled(enabled) {
        micButton.disabled = true;
        try {
          const response = await fetch('/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ enabled: Boolean(enabled) })
          });
          if (!response.ok) throw new Error(`Control request failed: ${response.status}`);
          const payload = await response.json();
          applyVoiceEnabled(payload.enabled);
          if (payload.enabled) setStatus('LISTENING', 'live');
        } catch (err) {
          console.warn('Voice control unavailable:', err);
          setStatus('OFFLINE');
        } finally {
          micButton.disabled = false;
        }
      }

      function triggerTap() {
        state.tap = 1;
        if (navigator.vibrate) navigator.vibrate(12);
      }

      function updateInputStyle(value) {
        amplitudeSlider.style.setProperty('--level', `${Math.round(value * 100)}%`);
      }

      micButton.addEventListener('click', event => {
        event.stopPropagation();
        setVoiceEnabled(!state.voiceEnabled);
        triggerTap();
      });

      motionButton.addEventListener('click', event => {
        event.stopPropagation();
        state.motion = state.motion > 0.5 ? 0 : 1;
        motionButton.classList.toggle('active', state.motion > 0.5);
        motionButton.setAttribute('aria-pressed', String(state.motion > 0.5));
        triggerTap();
      });

      exitButton.addEventListener('click', async event => {
        event.stopPropagation();
        exitButton.disabled = true;
        setStatus('CLOSING');
        try {
          const shutdownRequest = fetch('/control', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ action: 'shutdown' }),
            keepalive: true
          });
          // 仅尝试关闭当前语音球页面，不终止用户其它浏览器窗口或标签页。
          // 部分浏览器只允许脚本关闭由脚本打开的页面，失败时仍保留 STOPPED 状态。
          setTimeout(() => {
            window.open('', '_self');
            window.close();
          }, 50);
          const response = await shutdownRequest;
          if (!response.ok) throw new Error(`Shutdown request failed: ${response.status}`);
          state.targetAmplitude = 0;
          state.activityTarget = 0;
          setStatus('STOPPED');
        } catch (err) {
          console.warn('Shutdown request failed:', err);
          exitButton.disabled = false;
          setStatus('OFFLINE');
        }
      });

      amplitudeSlider.addEventListener('input', event => {
        if (state.micActive) stopMicrophone();
        const value = Number(event.target.value);
        state.targetAmplitude = value;
        state.targetBass = 0.12 + value * 0.78;
        state.targetMid = 0.15 + value * 0.72;
        state.targetTreble = 0.09 + value * 0.62;
        state.activityTarget = value > 0.075 ? 1 : 0;
        updateInputStyle(value);
      });

      canvas.addEventListener('pointerdown', triggerTap);
      window.addEventListener('pointermove', event => {
        state.pointerTarget.x = (event.clientX / innerWidth - 0.5) * 2;
        state.pointerTarget.y = (0.5 - event.clientY / innerHeight) * 2;
      }, { passive: true });
      window.addEventListener('pointerleave', () => {
        state.pointerTarget.x = 0;
        state.pointerTarget.y = 0;
      });
      window.addEventListener('resize', resize, { passive: true });
      window.addEventListener('pagehide', () => {
        if (state.micActive) stopMicrophone();
      });
      canvas.addEventListener('webglcontextlost', event => {
        event.preventDefault();
        error.textContent = 'WebGL context was lost. Please refresh the page.';
        error.style.display = 'grid';
      });

      const prefersReducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
      if (prefersReducedMotion.matches) {
        state.motion = 0;
        motionButton.classList.remove('active');
        motionButton.setAttribute('aria-pressed', 'false');
      }

      function bindTexture(unit, texture, location) {
        gl.activeTexture(gl.TEXTURE0 + unit);
        gl.bindTexture(gl.TEXTURE_2D, texture);
        gl.uniform1i(location, unit);
      }

      function drawFullscreen(program) {
        gl.useProgram(program);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      function renderScene(nowSeconds, orbRadius, centerY) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets.scene.framebuffer);
        gl.viewport(0, 0, targets.width, targets.height);
        gl.disable(gl.BLEND);
        gl.useProgram(programs.scene);
        gl.uniform2f(uniforms.scene.uResolution, targets.width, targets.height);
        gl.uniform2f(uniforms.scene.uPointer, state.pointer.x, state.pointer.y);
        gl.uniform1f(uniforms.scene.uTime, nowSeconds);
        gl.uniform1f(uniforms.scene.uAmplitude, state.amplitude);
        gl.uniform1f(uniforms.scene.uBass, state.bass);
        gl.uniform1f(uniforms.scene.uMid, state.mid);
        gl.uniform1f(uniforms.scene.uTreble, state.treble);
        gl.uniform1f(uniforms.scene.uActivity, state.activity);
        gl.uniform1f(uniforms.scene.uTap, state.tap);
        gl.uniform1f(uniforms.scene.uMotion, state.motion);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        gl.enable(gl.BLEND);
        gl.blendFunc(gl.ONE, gl.ONE);
        gl.useProgram(programs.particles);
        gl.uniform2f(uniforms.particles.uResolution, targets.width, targets.height);
        gl.uniform1f(uniforms.particles.uPixelRatio, state.pixelRatio);
        gl.uniform1f(uniforms.particles.uTime, nowSeconds);
        gl.uniform1f(uniforms.particles.uOrbRadius, orbRadius);
        gl.uniform1f(uniforms.particles.uCenterY, centerY);
        gl.uniform1f(uniforms.particles.uAmplitude, state.amplitude);
        gl.uniform1f(uniforms.particles.uBass, state.bass);
        gl.uniform1f(uniforms.particles.uTreble, state.treble);
        gl.uniform1f(uniforms.particles.uActivity, state.activity);
        gl.uniform1f(uniforms.particles.uMotion, state.motion);
        gl.drawArrays(gl.POINTS, 0, 0);
        gl.disable(gl.BLEND);
      }

      function renderBloom() {
        gl.bindFramebuffer(gl.FRAMEBUFFER, targets.bloomA.framebuffer);
        gl.viewport(0, 0, targets.bloomWidth, targets.bloomHeight);
        gl.useProgram(programs.extract);
        bindTexture(0, targets.scene.texture, uniforms.extract.uTexture);
        gl.drawArrays(gl.TRIANGLES, 0, 3);

        const passes = [
          [targets.bloomB, targets.bloomA.texture, 1, 0],
          [targets.bloomA, targets.bloomB.texture, 0, 1],
          [targets.bloomB, targets.bloomA.texture, 1.65, 0],
          [targets.bloomA, targets.bloomB.texture, 0, 1.65]
        ];
        gl.useProgram(programs.blur);
        gl.uniform2f(uniforms.blur.uTexel, 1 / targets.bloomWidth, 1 / targets.bloomHeight);
        for (const [target, texture, dx, dy] of passes) {
          gl.bindFramebuffer(gl.FRAMEBUFFER, target.framebuffer);
          bindTexture(0, texture, uniforms.blur.uTexture);
          gl.uniform2f(uniforms.blur.uDirection, dx, dy);
          gl.drawArrays(gl.TRIANGLES, 0, 3);
        }
      }

      function renderComposite(nowSeconds) {
        gl.bindFramebuffer(gl.FRAMEBUFFER, null);
        gl.viewport(0, 0, canvas.width, canvas.height);
        gl.useProgram(programs.composite);
        bindTexture(0, targets.scene.texture, uniforms.composite.uScene);
        bindTexture(1, targets.bloomA.texture, uniforms.composite.uBloom);
        gl.uniform2f(uniforms.composite.uResolution, canvas.width, canvas.height);
        gl.uniform1f(uniforms.composite.uTime, nowSeconds);
        gl.uniform1f(uniforms.composite.uAmplitude, state.amplitude);
        gl.drawArrays(gl.TRIANGLES, 0, 3);
      }

      function render(now) {
        resize();
        readMicrophone();

        const dt = Math.min(0.05, Math.max(0.001, (now - state.lastFrame) / 1000));
        state.lastFrame = now;
        const attack = 1 - Math.exp(-dt * 5.5);
        const release = 1 - Math.exp(-dt * 2.6);
        const ampRate = state.targetAmplitude > state.amplitude ? attack : release;
        state.amplitude += (state.targetAmplitude - state.amplitude) * ampRate;
        state.bass += (state.targetBass - state.bass) * (1 - Math.exp(-dt * 3.5));
        state.mid += (state.targetMid - state.mid) * (1 - Math.exp(-dt * 3.2));
        state.treble += (state.targetTreble - state.treble) * (1 - Math.exp(-dt * 4.5));
        state.pointer.x += (state.pointerTarget.x - state.pointer.x) * (1 - Math.exp(-dt * 3.5));
        state.pointer.y += (state.pointerTarget.y - state.pointer.y) * (1 - Math.exp(-dt * 3.5));
        state.tap = Math.max(0, state.tap - dt * 2.55);
        updateVoiceActivity(dt);

        const portrait = Math.min(1, Math.max(0, (innerHeight / innerWidth - 1.12) / 0.46));
        const smoothPortrait = portrait * portrait * (3 - 2 * portrait);
        const centerY = 0.025 + smoothPortrait * 0.06;
        const orbRadius = 0.35 + smoothPortrait * 0.135 + state.bass * 0.012 + Math.pow(state.amplitude, 0.64) * 0.020;
        const nowSeconds = now / 1000;

        renderScene(nowSeconds, orbRadius, centerY);
        renderComposite(nowSeconds);
        requestAnimationFrame(render);
      }

      // Stable public integration surface for external audio engines.
      window.SiriOrb = Object.freeze({
        setAmplitude(value, tone = 0.5) {
          const amplitude = Math.min(1, Math.max(0, Number(value) || 0));
          const colorTone = Math.min(1, Math.max(0, Number(tone) || 0));
          if (state.micActive) stopMicrophone();
          state.targetAmplitude = amplitude;
          state.targetBass = amplitude * (1.0 - colorTone * 0.45);
          state.targetMid = amplitude * (0.62 + (1.0 - Math.abs(colorTone - 0.5) * 2.0) * 0.38);
          state.targetTreble = amplitude * (0.42 + colorTone * 0.58);
          state.activityTarget = amplitude > 0.075 ? 1 : 0;
          amplitudeSlider.value = String(amplitude);
          updateInputStyle(amplitude);
        },
        pulse: triggerTap,
        getAmplitude() { return state.amplitude; },
        startMicrophone,
        stopMicrophone
      });

      function applyProjectLevel(payload) {
        if (!payload) return;
        if (typeof payload.enabled === 'boolean') applyVoiceEnabled(payload.enabled);
        if (!state.voiceEnabled) return;
        window.SiriOrb.setAmplitude(payload.amplitude, payload.tone ?? 0.5);
        if (!state.micActive) {
          const speaking = Boolean(payload.speaking);
          setStatus(payload.status || (speaking ? 'SPEAKING' : 'LISTENING'), speaking ? 'speaking' : 'live');
        }
      }

      function connectProjectAudio() {
        if (!window.EventSource) return;
        const events = new EventSource('/events');
        events.addEventListener('state', event => {
          try { applyProjectLevel(JSON.parse(event.data)); } catch (err) { console.warn(err); }
        });
        events.addEventListener('level', event => {
          try { applyProjectLevel(JSON.parse(event.data)); } catch (err) { console.warn(err); }
        });
        events.onerror = () => {
          if (!state.micActive && state.voiceEnabled) setStatus('WAITING');
        };
      }

      try {
        resize();
        applyVoiceEnabled(true);
        updateInputStyle(state.targetAmplitude);
        connectProjectAudio();
        requestAnimationFrame(render);
      } catch (renderError) {
        console.error(renderError);
        error.textContent = 'Voice orb rendering failed. Please refresh the page.';
        error.style.display = 'grid';
      }
    })();
  </script>
</body>
</html>
